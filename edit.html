<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Επεξεργασία περιεχομένου</title>
  <style>
    :root { --teal: #3A6B7E; --gold: #c9a24b; --bg: #F7F5F0; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: var(--bg); color: #1E293B; }

    .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center;
           justify-content: space-between; gap: 12px; padding: 14px 20px;
           background: var(--teal); color: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
    .bar strong { font-size: 1rem; }
    .bar button { font: inherit; font-weight: 600; border: 0; border-radius: 8px;
                  padding: 10px 18px; cursor: pointer; background: var(--gold); color: #1E293B; }
    .bar button:disabled { opacity: .5; cursor: default; }

    .wrap { max-width: 760px; margin: 28px auto; padding: 0 20px; }
    .note { background: #fff; border-left: 4px solid var(--gold); padding: 14px 18px;
            border-radius: 8px; margin-bottom: 24px; font-size: .95rem; line-height: 1.5; }
    h2.group { font-size: 1.05rem; margin: 32px 0 12px; color: var(--teal); }

    .field { background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
             box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .field label { display: block; font-size: .78rem; text-transform: uppercase;
                   letter-spacing: .5px; color: #888; margin-bottom: 8px; }
    .field textarea, .field input[type=text] { width: 100%; font: inherit; line-height: 1.5;
                   border: 1px solid #ddd; border-radius: 8px; padding: 12px; resize: vertical; }
    .field textarea { min-height: 52px; }
    .field textarea:focus, .field input:focus { outline: 2px solid var(--teal); border-color: var(--teal); }
    .preview { margin-top: 10px; max-height: 120px; border-radius: 8px; border: 1px solid #eee; }

    .gal-item { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .gal-item img { width: 64px; height: 48px; object-fit: cover; border-radius: 6px; border: 1px solid #eee; flex-shrink: 0; }
    .gal-item input { flex: 1; font: inherit; border: 1px solid #ddd; border-radius: 8px; padding: 10px; }
    .gal-item button { font: inherit; border: 0; background: #f3d6d6; color: #8a2b2b;
                       border-radius: 8px; padding: 10px 12px; cursor: pointer; }
    .add-btn { font: inherit; border: 1px dashed var(--teal); background: #fff; color: var(--teal);
               border-radius: 8px; padding: 12px; cursor: pointer; width: 100%; }

    .gate { max-width: 360px; margin: 80px auto; background: #fff; padding: 32px;
            border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,.1); text-align: center; }
    .gate h1 { font-size: 1.3rem; margin: 0 0 18px; }
    .gate input { width: 100%; font: inherit; padding: 12px; border: 1px solid #ddd;
                  border-radius: 8px; margin-bottom: 14px; }
    .gate button { width: 100%; font: inherit; font-weight: 600; border: 0; border-radius: 8px;
                   padding: 12px; cursor: pointer; background: var(--teal); color: #fff; }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
             background: #1E293B; color: #fff; padding: 14px 22px; border-radius: 10px;
             font-size: .95rem; opacity: 0; transition: opacity .3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast.error { background: #8a2b2b; }
  </style>
</head>
<body>

  <div id="gate" class="gate">
    <h1>Επεξεργασία περιεχομένου</h1>
    <input id="pass" type="password" placeholder="Κωδικός" autocomplete="off">
    <button onclick="enter()">Είσοδος</button>
  </div>

  <div id="editor" style="display:none;">
    <div class="bar">
      <strong>Επεξεργασία περιεχομένου</strong>
      <button id="saveBtn" onclick="save()">Αποθήκευση αλλαγών</button>
    </div>
    <div class="wrap">
      <div class="note">
        Αλλάξτε κείμενα και εικόνες παρακάτω και πατήστε <b>Αποθήκευση αλλαγών</b>.
        Για εικόνες, επικολλήστε τον σύνδεσμο (link) της φωτογραφίας.
        Η ιστοσελίδα ενημερώνεται σε περίπου ένα λεπτό.
      </div>
      <div id="textFields"></div>
      <div id="imageFields"></div>
      <div id="galleryFields"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const SOURCE_FILE = "index.html";
    let passcode = "";
    let galleries = {}; // key -> array of urls

    function enter() {
      passcode = document.getElementById("pass").value.trim();
      if (!passcode) return;
      document.getElementById("gate").style.display = "none";
      document.getElementById("editor").style.display = "block";
      loadFields();
    }

    async function loadFields() {
      const res = await fetch(SOURCE_FILE + "?t=" + Date.now());
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, "text/html");

      // TEXT
      const tEls = doc.querySelectorAll("[data-edit]");
      const tBox = document.getElementById("textFields");
      if (tEls.length) tBox.innerHTML = '<h2 class="group">Κείμενα</h2>';
      tEls.forEach(el => {
        const key = el.getAttribute("data-edit");
        const current = el.textContent.trim();
        const labelText = current.length > 45 ? current.slice(0, 45) + "…" : current;
        const f = document.createElement("div");
        f.className = "field";
        f.innerHTML = '<label></label><textarea data-key="' + key + '"></textarea>';
        f.querySelector("label").textContent = labelText || key;
        f.querySelector("textarea").value = current;
        tBox.appendChild(f);
      });

      // SINGLE IMAGES
      const iEls = doc.querySelectorAll("[data-img]");
      const iBox = document.getElementById("imageFields");
      if (iEls.length) iBox.innerHTML = '<h2 class="group">Εικόνες</h2>';
      iEls.forEach(el => {
        const key = el.getAttribute("data-img");
        const cur = el.getAttribute("src");
        const f = document.createElement("div");
        f.className = "field";
        f.innerHTML =
          '<label>' + key + ' — σύνδεσμος εικόνας</label>' +
          '<input type="text" data-imgkey="' + key + '" value="' + cur + '">' +
          '<img class="preview" src="' + cur + '">';
        const input = f.querySelector("input");
        const prev = f.querySelector(".preview");
        input.addEventListener("input", () => { prev.src = input.value; });
        iBox.appendChild(f);
      });

      // GALLERIES
      const gEls = doc.querySelectorAll("[data-gallery]");
      const gBox = document.getElementById("galleryFields");
      gBox.innerHTML = "";
      gEls.forEach(el => {
        const key = el.getAttribute("data-gallery");
        const urls = Array.from(el.querySelectorAll("img")).map(img => img.getAttribute("src"));
        galleries[key] = urls;
        const wrap = document.createElement("div");
        wrap.innerHTML = '<h2 class="group">Συλλογή φωτογραφιών: ' + key + '</h2>';
        const f = document.createElement("div");
        f.className = "field";
        f.id = "gal-" + key;
        wrap.appendChild(f);
        const add = document.createElement("button");
        add.className = "add-btn";
        add.textContent = "+ Προσθήκη φωτογραφίας";
        add.onclick = () => { galleries[key].push(""); renderGallery(key); };
        wrap.appendChild(add);
        gBox.appendChild(wrap);
        renderGallery(key);
      });
    }

    function renderGallery(key) {
      const box = document.getElementById("gal-" + key);
      box.innerHTML = "";
      galleries[key].forEach((url, idx) => {
        const row = document.createElement("div");
        row.className = "gal-item";
        row.innerHTML =
          '<img src="' + url + '">' +
          '<input type="text" value="' + url + '" placeholder="σύνδεσμος εικόνας">' +
          '<button>Διαγραφή</button>';
        const input = row.querySelector("input");
        const img = row.querySelector("img");
        input.addEventListener("input", () => { galleries[key][idx] = input.value; img.src = input.value; });
        row.querySelector("button").onclick = () => { galleries[key].splice(idx, 1); renderGallery(key); };
        box.appendChild(row);
      });
    }

    async function save() {
      const btn = document.getElementById("saveBtn");
      const edits = {}, images = {};
      document.querySelectorAll("textarea[data-key]").forEach(t => { edits[t.getAttribute("data-key")] = t.value; });
      document.querySelectorAll("input[data-imgkey]").forEach(t => { images[t.getAttribute("data-imgkey")] = t.value.trim(); });
      const cleanGal = {};
      for (const k in galleries) cleanGal[k] = galleries[k].filter(u => u.trim());

      if (!confirm("Αποθήκευση των αλλαγών στην ιστοσελίδα;")) return;

      btn.disabled = true;
      btn.textContent = "Αποθήκευση...";
      try {
        const res = await fetch("/.netlify/functions/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ passcode, edits, images, galleries: cleanGal }),
        });
        const data = await res.json();
        if (data.ok) toast("Αποθηκεύτηκε! Η ιστοσελίδα ενημερώνεται σε λίγο.");
        else toast(data.error || "Κάτι πήγε στραβά.", true);
      } catch (e) { toast("Σφάλμα σύνδεσης.", true); }
      btn.disabled = false;
      btn.textContent = "Αποθήκευση αλλαγών";
    }

    function toast(msg, isError) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "toast show" + (isError ? " error" : "");
      setTimeout(() => { t.className = "toast"; }, 4000);
    }
  </script>
</body>
</html>
