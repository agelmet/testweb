<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Επεξεργασία ιστοσελίδας</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }

    /* Passcode gate */
    #gate { position: fixed; inset: 0; z-index: 100000; display: flex; align-items: center;
            justify-content: center; background: #F7F5F0; }
    #gate .card { background: #fff; padding: 32px; border-radius: 14px; width: 340px;
                  box-shadow: 0 4px 24px rgba(0,0,0,.1); text-align: center; }
    #gate h1 { font-size: 1.2rem; margin: 0 0 18px; color: #1E293B; }
    #gate input { width: 100%; font: inherit; padding: 12px; border: 1px solid #ddd;
                  border-radius: 8px; margin-bottom: 14px; }
    #gate button { width: 100%; font: inherit; font-weight: 600; border: 0; border-radius: 8px;
                   padding: 12px; cursor: pointer; background: #3A6B7E; color: #fff; }

    /* Save bar */
    #savebar { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 99999;
               display: none; align-items: center; justify-content: space-between; gap: 12px;
               padding: 0 20px; background: #3A6B7E; color: #fff;
               box-shadow: 0 2px 10px rgba(0,0,0,.2); }
    #savebar .msg { font-size: .9rem; opacity: .92; }
    #savebar .actions { display: flex; gap: 10px; align-items: center; }
    #savebar button { font: inherit; font-weight: 600; border: 0; border-radius: 8px;
                      padding: 10px 20px; cursor: pointer; background: #c9a24b; color: #1E293B; }
    #savebar button:disabled { opacity: .5; cursor: default; }

    /* Iframe holds the real, fully-styled page */
    #frame { position: fixed; top: 56px; left: 0; right: 0; bottom: 0; width: 100%;
             height: calc(100% - 56px); border: 0; display: none; background: #fff; }

    /* Floating editor panel (for image / button) */
    #panel { position: fixed; z-index: 99998; display: none; width: 340px; background: #fff;
             border: 1px solid #ddd; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.18);
             padding: 16px; }
    #panel h3 { margin: 0 0 12px; font-size: .95rem; color: #3A6B7E; }
    #panel label { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .5px;
                   color: #888; margin: 10px 0 4px; }
    #panel label:first-of-type { margin-top: 0; }
    #panel input { width: 100%; font: inherit; border: 1px solid #ddd; border-radius: 7px;
                   padding: 9px; }
    #panel .thumb { width: 100%; height: 90px; object-fit: cover; border-radius: 7px;
                    border: 1px solid #eee; margin-top: 10px; }
    #panel .panel-actions { display: flex; gap: 8px; margin-top: 14px; }
    #panel .panel-actions button { flex: 1; font: inherit; border: 0; border-radius: 7px;
                   padding: 9px; cursor: pointer; }
    #panel .ok { background: #3A6B7E; color: #fff; }
    #panel .cancel { background: #eee; color: #333; }

    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 100001;
             background: #1E293B; color: #fff; padding: 14px 22px; border-radius: 10px;
             font-size: .95rem; opacity: 0; transition: opacity .3s; pointer-events: none; }
    #toast.show { opacity: 1; }
    #toast.error { background: #8a2b2b; }
  </style>
</head>
<body>

  <div id="gate">
    <div class="card">
      <h1>Επεξεργασία ιστοσελίδας</h1>
      <input id="pass" type="password" placeholder="Κωδικός" autocomplete="off">
      <button onclick="enter()">Είσοδος</button>
    </div>
  </div>

  <div id="savebar">
    <span class="msg">Πατήστε σε κείμενο για αλλαγή. Σε εικόνα ή κουμπί για επεξεργασία.</span>
    <div class="actions">
      <button id="saveBtn" onclick="save()">Αποθήκευση αλλαγών</button>
    </div>
  </div>

  <iframe id="frame"></iframe>

  <div id="panel"></div>
  <div id="toast"></div>

  <script>
    const SOURCE_FILE = "index.html";
    let passcode = "";
    let doc = null; // the iframe's document

    function enter() {
      passcode = document.getElementById("pass").value.trim();
      if (!passcode) return;
      document.getElementById("gate").style.display = "none";
      loadPage();
    }

    async function loadPage() {
      const res = await fetch(SOURCE_FILE + "?t=" + Date.now());
      let html = await res.text();

      const frame = document.getElementById("frame");
      frame.style.display = "block";
      doc = frame.contentDocument;
      doc.open();
      doc.write(html);
      doc.close();

      // Wait for the iframe page (fonts, tailwind, icons) to finish, then turn on editing
      frame.onload = () => setTimeout(enableEditing, 300);
      // Fallback if onload already fired
      setTimeout(() => { if (!document.body.classList.contains("editing")) enableEditing(); }, 1500);
    }

    function enableEditing() {
      if (document.body.classList.contains("editing")) return;
      document.body.classList.add("editing");
      document.getElementById("savebar").style.display = "flex";

      // Inject highlight styles INTO the iframe
      const style = doc.createElement("style");
      style.textContent = `
        .reveal{opacity:1 !important;transform:none !important;}
        [data-edit]{outline:2px dashed transparent;outline-offset:3px;cursor:text;border-radius:3px;transition:.15s;}
        [data-edit]:hover{outline-color:#c9a24b;background:rgba(201,162,75,.10);}
        [data-edit]:focus{outline:2px solid #3A6B7E;background:rgba(58,107,126,.06);}
        [data-img],[data-link]{outline:2px dashed transparent;outline-offset:3px;cursor:pointer;transition:.15s;}
        [data-img]:hover,[data-link]:hover{outline-color:#3A6B7E;}
        a{pointer-events:auto;}
        .ax-del{position:absolute;top:8px;right:8px;z-index:60;border:0;background:rgba(138,43,43,.95);
          color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:.8rem;font-family:system-ui;}
        .ax-galadd{display:block;margin:14px auto;text-align:center;font-family:system-ui;}
        .ax-galadd input{padding:10px;border:1px solid #ddd;border-radius:8px;margin-right:8px;width:280px;max-width:55%;}
        .ax-galadd button{border:1px dashed #3A6B7E;background:#fff;color:#3A6B7E;border-radius:8px;padding:10px 16px;cursor:pointer;}
      `;
      doc.head.appendChild(style);

      // Disable the page's own click scripts (lightbox/menu) so they don't hijack clicks
      doc.querySelectorAll("[onclick]").forEach(el => el.removeAttribute("onclick"));

      // TEXT — editable in place
      doc.querySelectorAll("[data-edit]").forEach(el => {
        el.setAttribute("contenteditable", "true");
        el.addEventListener("click", e => e.stopPropagation());
      });

      // IMAGES — click opens floating panel
      doc.querySelectorAll("[data-img]").forEach(img => {
        img.addEventListener("click", e => {
          e.preventDefault(); e.stopPropagation();
          openImagePanel(img);
        });
      });

      // LINKS / BUTTONS — click opens floating panel
      doc.querySelectorAll("[data-link]").forEach(a => {
        a.addEventListener("click", e => {
          e.preventDefault(); e.stopPropagation();
          openLinkPanel(a);
        });
      });

      // GALLERIES — delete buttons + add control
      doc.querySelectorAll("[data-gallery]").forEach(gal => {
        gal.style.position = "relative";
        attachGallery(gal);
      });

      // click elsewhere closes panel
      doc.addEventListener("click", closePanel);
    }

    function attachGallery(gal) {
      gal.querySelectorAll(":scope > button").forEach(b => {
        if (b.querySelector(".ax-del")) return;
        b.style.position = "relative";
        const del = doc.createElement("button");
        del.className = "ax-del"; del.textContent = "Διαγραφή";
        del.onclick = (e) => { e.stopPropagation(); b.remove(); };
        b.appendChild(del);
      });
      if (gal.nextElementSibling && gal.nextElementSibling.classList.contains("ax-galadd")) return;
      const add = doc.createElement("div");
      add.className = "ax-galadd";
      add.innerHTML = '<input type="text" placeholder="Σύνδεσμος νέας φωτογραφίας"><button>+ Προσθήκη φωτογραφίας</button>';
      const inp = add.querySelector("input");
      add.querySelector("button").onclick = () => {
        const url = inp.value.trim(); if (!url) return;
        const b = doc.createElement("button");
        b.className = "w-full break-inside-avoid overflow-hidden group relative reveal shadow-md rounded-md";
        b.innerHTML = '<img src="' + url + '" alt="" class="w-full h-auto">';
        gal.appendChild(b); inp.value = ""; attachGallery(gal);
      };
      gal.insertAdjacentElement("afterend", add);
    }

    // ── Floating panels ──
    function panelAt(targetRect) {
      const panel = document.getElementById("panel");
      panel.style.display = "block";
      // position near the element, accounting for iframe offset (iframe starts at top:56)
      const top = Math.min(targetRect.top + 56 + 10, window.innerHeight - 320);
      const left = Math.min(Math.max(targetRect.left, 16), window.innerWidth - 356);
      panel.style.top = Math.max(66, top) + "px";
      panel.style.left = left + "px";
      return panel;
    }

    function openImagePanel(img) {
      const panel = panelAt(img.getBoundingClientRect());
      panel.innerHTML =
        '<h3>Αλλαγή εικόνας</h3>' +
        '<label>Σύνδεσμος εικόνας</label><input type="text" id="p-src">' +
        '<img class="thumb" id="p-thumb">' +
        '<div class="panel-actions"><button class="cancel" onclick="closePanel()">Άκυρο</button>' +
        '<button class="ok" id="p-ok">Εφαρμογή</button></div>';
      const src = document.getElementById("p-src");
      const thumb = document.getElementById("p-thumb");
      src.value = img.getAttribute("src") || "";
      thumb.src = src.value;
      src.addEventListener("input", () => thumb.src = src.value);
      document.getElementById("p-ok").onclick = () => { img.src = src.value; closePanel(); };
    }

    function openLinkPanel(a) {
      const panel = panelAt(a.getBoundingClientRect());
      let txt = ""; a.childNodes.forEach(n => { if (n.nodeType === 3) txt += n.textContent; });
      panel.innerHTML =
        '<h3>Επεξεργασία κουμπιού</h3>' +
        '<label>Κείμενο</label><input type="text" id="p-text">' +
        '<label>Σύνδεσμος (πού οδηγεί)</label><input type="text" id="p-href">' +
        '<div class="panel-actions"><button class="cancel" onclick="closePanel()">Άκυρο</button>' +
        '<button class="ok" id="p-ok">Εφαρμογή</button></div>';
      document.getElementById("p-text").value = txt.trim();
      document.getElementById("p-href").value = a.getAttribute("href") || "";
      document.getElementById("p-ok").onclick = () => {
        const newText = document.getElementById("p-text").value;
        const newHref = document.getElementById("p-href").value;
        // replace text nodes, keep icons
        const icons = Array.from(a.childNodes).filter(n => n.nodeType === 1);
        a.textContent = "";
        a.appendChild(doc.createTextNode(newText + " "));
        icons.forEach(ic => a.appendChild(ic));
        a.setAttribute("href", newHref);
        a.setAttribute("data-newtext", newText);
        a.setAttribute("data-newhref", newHref);
        closePanel();
      };
    }

    function closePanel() {
      document.getElementById("panel").style.display = "none";
    }

    async function save() {
      const btn = document.getElementById("saveBtn");
      const edits = {}, images = {}, links = {}, galleries = {};

      doc.querySelectorAll("[data-edit]").forEach(el => {
        edits[el.getAttribute("data-edit")] = el.innerText.trim();
      });
      doc.querySelectorAll("[data-img]").forEach(img => {
        images[img.getAttribute("data-img")] = img.getAttribute("src");
      });
      doc.querySelectorAll("[data-link]").forEach(a => {
        let txt = a.getAttribute("data-newtext");
        if (txt === null) { txt = ""; a.childNodes.forEach(n => { if (n.nodeType === 3) txt += n.textContent; }); txt = txt.trim(); }
        links[a.getAttribute("data-link")] = { text: txt, href: a.getAttribute("href") || "" };
      });
      doc.querySelectorAll("[data-gallery]").forEach(gal => {
        galleries[gal.getAttribute("data-gallery")] =
          Array.from(gal.querySelectorAll("img")).map(i => i.getAttribute("src")).filter(Boolean);
      });

      if (!confirm("Αποθήκευση των αλλαγών στην ιστοσελίδα;")) return;
      btn.disabled = true; btn.textContent = "Αποθήκευση...";
      try {
        const res = await fetch("/.netlify/functions/save", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ passcode, edits, images, links, galleries }),
        });
        const data = await res.json();
        if (data.ok) toast("Αποθηκεύτηκε! Η ιστοσελίδα ενημερώνεται σε λίγο.");
        else toast(data.error || "Κάτι πήγε στραβά.", true);
      } catch (e) { toast("Σφάλμα σύνδεσης.", true); }
      btn.disabled = false; btn.textContent = "Αποθήκευση αλλαγών";
    }

    function toast(msg, isError) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "show" + (isError ? " error" : "");
      setTimeout(() => { t.className = ""; }, 4000);
    }
  </script>
</body>
</html>
