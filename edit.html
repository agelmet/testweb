<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Επεξεργασία περιεχομένου</title>
  <style>
    :root { --teal: #0f3d3e; --gold: #c9a24b; --bg: #f6f5f1; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: var(--bg); color: #1a1a1a; }

    .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center;
           justify-content: space-between; gap: 12px; padding: 14px 20px;
           background: var(--teal); color: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
    .bar strong { font-size: 1rem; letter-spacing: .3px; }
    .bar button { font: inherit; font-weight: 600; border: 0; border-radius: 8px;
                  padding: 10px 18px; cursor: pointer; background: var(--gold); color: #1a1a1a; }
    .bar button:disabled { opacity: .5; cursor: default; }

    .wrap { max-width: 760px; margin: 28px auto; padding: 0 20px; }
    .note { background: #fff; border-left: 4px solid var(--gold); padding: 14px 18px;
            border-radius: 8px; margin-bottom: 24px; font-size: .95rem; line-height: 1.5; }

    .field { background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
             box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .field label { display: block; font-size: .78rem; text-transform: uppercase;
                   letter-spacing: .5px; color: #888; margin-bottom: 8px; }
    .field textarea { width: 100%; font: inherit; line-height: 1.5; border: 1px solid #ddd;
                      border-radius: 8px; padding: 12px; resize: vertical; min-height: 52px; }
    .field textarea:focus { outline: 2px solid var(--teal); border-color: var(--teal); }

    .gate { max-width: 360px; margin: 80px auto; background: #fff; padding: 32px;
            border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,.1); text-align: center; }
    .gate h1 { font-size: 1.3rem; margin: 0 0 18px; }
    .gate input { width: 100%; font: inherit; padding: 12px; border: 1px solid #ddd;
                  border-radius: 8px; margin-bottom: 14px; }
    .gate button { width: 100%; font: inherit; font-weight: 600; border: 0; border-radius: 8px;
                   padding: 12px; cursor: pointer; background: var(--teal); color: #fff; }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
             background: #1a1a1a; color: #fff; padding: 14px 22px; border-radius: 10px;
             font-size: .95rem; opacity: 0; transition: opacity .3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast.error { background: #8a2b2b; }
  </style>
</head>
<body>

  <!-- Passcode gate -->
  <div id="gate" class="gate">
    <h1>Επεξεργασία περιεχομένου</h1>
    <input id="pass" type="password" placeholder="Κωδικός" autocomplete="off">
    <button onclick="enter()">Είσοδος</button>
  </div>

  <!-- Editor (hidden until passcode entered) -->
  <div id="editor" style="display:none;">
    <div class="bar">
      <strong>Επεξεργασία περιεχομένου</strong>
      <button id="saveBtn" onclick="save()">Αποθήκευση αλλαγών</button>
    </div>
    <div class="wrap">
      <div class="note">
        Αλλάξτε τα κείμενα παρακάτω και πατήστε <b>Αποθήκευση αλλαγών</b>.
        Η ιστοσελίδα ενημερώνεται σε περίπου ένα λεπτό.
      </div>
      <div id="fields"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // Which file to read the editable text FROM (your live page)
    const SOURCE_FILE = "index.html";
    let passcode = "";

    function enter() {
      passcode = document.getElementById("pass").value.trim();
      if (!passcode) return;
      document.getElementById("gate").style.display = "none";
      document.getElementById("editor").style.display = "block";
      loadFields();
    }

    // Fetch the live page, find every data-edit element, build a textarea for each
    async function loadFields() {
      const res = await fetch(SOURCE_FILE + "?t=" + Date.now());
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const els = doc.querySelectorAll("[data-edit]");
      const container = document.getElementById("fields");
      container.innerHTML = "";
      els.forEach(el => {
        const key = el.getAttribute("data-edit");
        const field = document.createElement("div");
        field.className = "field";
        field.innerHTML =
          '<label>' + key + '</label>' +
          '<textarea data-key="' + key + '"></textarea>';
        field.querySelector("textarea").value = el.textContent.trim();
        container.appendChild(field);
      });
      if (!els.length) {
        container.innerHTML = '<div class="note">Δεν βρέθηκαν επεξεργάσιμα στοιχεία.</div>';
      }
    }

    async function save() {
      const btn = document.getElementById("saveBtn");
      const edits = {};
      document.querySelectorAll("textarea[data-key]").forEach(t => {
        edits[t.getAttribute("data-key")] = t.value;
      });

      if (!confirm("Αποθήκευση των αλλαγών στην ιστοσελίδα;")) return;

      btn.disabled = true;
      btn.textContent = "Αποθήκευση...";
      try {
        const res = await fetch("/.netlify/functions/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ passcode, edits }),
        });
        const data = await res.json();
        if (data.ok) {
          toast("Αποθηκεύτηκε! Η ιστοσελίδα ενημερώνεται σε λίγο.");
        } else {
          toast(data.error || "Κάτι πήγε στραβά.", true);
        }
      } catch (e) {
        toast("Σφάλμα σύνδεσης.", true);
      }
      btn.disabled = false;
      btn.textContent = "Αποθήκευση αλλαγών";
    }

    function toast(msg, isError) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "toast show" + (isError ? " error" : "");
      setTimeout(() => { t.className = "toast"; }, 4000);
    }
  </script>
</body>
</html>
