<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Επεξεργασία ιστοσελίδας</title>
  <style>
    body { margin: 0; }

    /* Passcode gate */
    #gate { position: fixed; inset: 0; z-index: 100000; display: flex; align-items: center;
            justify-content: center; background: #F7F5F0; font-family: system-ui, sans-serif; }
    #gate .card { background: #fff; padding: 32px; border-radius: 14px; width: 340px;
                  box-shadow: 0 4px 24px rgba(0,0,0,.1); text-align: center; }
    #gate h1 { font-size: 1.2rem; margin: 0 0 18px; color: #1E293B; }
    #gate input { width: 100%; font: inherit; padding: 12px; border: 1px solid #ddd;
                  border-radius: 8px; margin-bottom: 14px; box-sizing: border-box; }
    #gate button { width: 100%; font: inherit; font-weight: 600; border: 0; border-radius: 8px;
                   padding: 12px; cursor: pointer; background: #3A6B7E; color: #fff; }

    /* Top save bar */
    #savebar { position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
               display: none; align-items: center; justify-content: space-between;
               gap: 12px; padding: 12px 20px; background: #3A6B7E; color: #fff;
               font-family: system-ui, sans-serif; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
    #savebar .msg { font-size: .9rem; opacity: .9; }
    #savebar button { font: inherit; font-weight: 600; border: 0; border-radius: 8px;
                      padding: 10px 20px; cursor: pointer; background: #c9a24b; color: #1E293B; }
    #savebar button:disabled { opacity: .5; cursor: default; }

    /* push the page down so the bar doesn't cover it */
    #stage { margin-top: 0; }
    body.editing #stage { margin-top: 56px; }

    /* Editable text highlight */
    [data-edit] { outline: 2px dashed transparent; outline-offset: 3px;
                  transition: outline-color .15s, background .15s; cursor: text; border-radius: 3px; }
    body.editing [data-edit]:hover { outline-color: #c9a24b; background: rgba(201,162,75,.08); }
    body.editing [data-edit]:focus { outline: 2px solid #3A6B7E; background: rgba(58,107,126,.06); }

    /* Image paste-box overlay */
    .img-editbox { font-family: system-ui, sans-serif; background: #fff; border: 1px solid #ddd;
                   border-radius: 8px; padding: 8px; margin: 8px auto; max-width: 420px;
                   box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .img-editbox label { display: block; font-size: .72rem; text-transform: uppercase;
                         letter-spacing: .5px; color: #888; margin-bottom: 6px; }
    .img-editbox input { width: 100%; font: inherit; border: 1px solid #ddd; border-radius: 6px;
                         padding: 9px; box-sizing: border-box; }

    /* Gallery controls */
    .gal-controls { font-family: system-ui, sans-serif; text-align: center; margin: 14px 0; }
    .gal-controls .add { font: inherit; border: 1px dashed #3A6B7E; background: #fff; color: #3A6B7E;
                         border-radius: 8px; padding: 10px 16px; cursor: pointer; }
    .gal-del { position: absolute; top: 8px; right: 8px; z-index: 5; font-family: system-ui, sans-serif;
               border: 0; background: rgba(138,43,43,.92); color: #fff; border-radius: 6px;
               padding: 6px 10px; cursor: pointer; font-size: .8rem; }
    .gal-add-input { font-family: system-ui, sans-serif; }

    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 99999;
             background: #1E293B; color: #fff; padding: 14px 22px; border-radius: 10px;
             font-family: system-ui, sans-serif; font-size: .95rem; opacity: 0;
             transition: opacity .3s; pointer-events: none; }
    #toast.show { opacity: 1; }
    #toast.error { background: #8a2b2b; }
  </style>
</head>
<body>

  <div id="gate">
    <div class="card">
      <h1>Επεξεργασία ιστοσελίδας</h1>
      <input id="pass" type="password" placeholder="Κωδικός" autocomplete="off">
      <button onclick="enter()">Είσοδος</button>
    </div>
  </div>

  <div id="savebar">
    <span class="msg">Πατήστε σε οποιοδήποτε κείμενο για να το αλλάξετε. Για εικόνες, επικολλήστε σύνδεσμο.</span>
    <button id="saveBtn" onclick="save()">Αποθήκευση αλλαγών</button>
  </div>

  <div id="stage"></div>
  <div id="toast"></div>

  <script>
    const SOURCE_FILE = "index.html";
    let passcode = "";

    function enter() {
      passcode = document.getElementById("pass").value.trim();
      if (!passcode) return;
      document.getElementById("gate").style.display = "none";
      loadPage();
    }

    async function loadPage() {
      const res = await fetch(SOURCE_FILE + "?t=" + Date.now());
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, "text/html");

      // Move the page's body content into our stage
      const stage = document.getElementById("stage");
      stage.innerHTML = doc.body.innerHTML;

      // Re-run the page's own scripts (icons, menus, animations) so it looks alive
      doc.querySelectorAll("script").forEach(old => {
        const s = document.createElement("script");
        if (old.src) s.src = old.src; else s.textContent = old.textContent;
        document.body.appendChild(s);
      });

      // turn on edit mode after a moment (let icons render)
      setTimeout(enableEditing, 600);
    }

    function enableEditing() {
      document.body.classList.add("editing");
      document.getElementById("savebar").style.display = "flex";

      // 1. TEXT: make every data-edit element directly editable
      document.querySelectorAll("#stage [data-edit]").forEach(el => {
        el.setAttribute("contenteditable", "true");
        el.addEventListener("click", e => e.stopPropagation());
      });

      // 2. IMAGES: add a paste-link box under each
      document.querySelectorAll("#stage [data-img]").forEach(img => {
        const box = document.createElement("div");
        box.className = "img-editbox";
        box.innerHTML = '<label>Σύνδεσμος εικόνας (paste link)</label><input type="text">';
        const input = box.querySelector("input");
        input.value = img.getAttribute("src");
        input.addEventListener("input", () => { img.src = input.value; });
        img.insertAdjacentElement("afterend", box);
      });

      // 3. GALLERIES: delete button on each photo + add box
      document.querySelectorAll("#stage [data-gallery]").forEach(gal => {
        gal.style.position = gal.style.position || "relative";
        attachGalleryControls(gal);
      });
    }

    function attachGalleryControls(gal) {
      // delete buttons on existing photos
      gal.querySelectorAll("button").forEach(photoBtn => {
        if (photoBtn.querySelector(".gal-del")) return;
        photoBtn.style.position = "relative";
        const del = document.createElement("button");
        del.className = "gal-del";
        del.textContent = "Διαγραφή";
        del.onclick = (e) => { e.stopPropagation(); photoBtn.remove(); };
        photoBtn.appendChild(del);
      });
      // add control after the gallery
      if (gal.nextElementSibling && gal.nextElementSibling.classList.contains("gal-controls")) return;
      const ctrl = document.createElement("div");
      ctrl.className = "gal-controls";
      ctrl.innerHTML = '<input class="gal-add-input" type="text" placeholder="Σύνδεσμος νέας φωτογραφίας" style="padding:10px;border:1px solid #ddd;border-radius:8px;margin-right:8px;width:280px;max-width:60%"><button class="add">+ Προσθήκη</button>';
      const input = ctrl.querySelector("input");
      ctrl.querySelector(".add").onclick = () => {
        const url = input.value.trim();
        if (!url) return;
        const btn = document.createElement("button");
        btn.className = "w-full break-inside-avoid overflow-hidden group relative reveal shadow-md rounded-md";
        btn.setAttribute("onclick", "openLightbox('" + url + "')");
        btn.innerHTML = '<img src="' + url + '" alt="" class="w-full h-auto">';
        gal.appendChild(btn);
        input.value = "";
        attachGalleryControls(gal);
      };
      gal.insertAdjacentElement("afterend", ctrl);
    }

    async function save() {
      const btn = document.getElementById("saveBtn");
      const edits = {}, images = {}, galleries = {};

      document.querySelectorAll("#stage [data-edit]").forEach(el => {
        edits[el.getAttribute("data-edit")] = el.innerText.trim();
      });
      document.querySelectorAll("#stage [data-img]").forEach(img => {
        images[img.getAttribute("data-img")] = img.getAttribute("src");
      });
      document.querySelectorAll("#stage [data-gallery]").forEach(gal => {
        const key = gal.getAttribute("data-gallery");
        galleries[key] = Array.from(gal.querySelectorAll("img")).map(i => i.getAttribute("src")).filter(Boolean);
      });

      if (!confirm("Αποθήκευση των αλλαγών στην ιστοσελίδα;")) return;
      btn.disabled = true; btn.textContent = "Αποθήκευση...";
      try {
        const res = await fetch("/.netlify/functions/save", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ passcode, edits, images, galleries }),
        });
        const data = await res.json();
        if (data.ok) toast("Αποθηκεύτηκε! Η ιστοσελίδα ενημερώνεται σε λίγο.");
        else toast(data.error || "Κάτι πήγε στραβά.", true);
      } catch (e) { toast("Σφάλμα σύνδεσης.", true); }
      btn.disabled = false; btn.textContent = "Αποθήκευση αλλαγών";
    }

    function toast(msg, isError) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "show" + (isError ? " error" : "");
      setTimeout(() => { t.className = ""; }, 4000);
    }
  </script>
</body>
</html>
